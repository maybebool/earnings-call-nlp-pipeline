[project]
name = "earnings-call-nlp-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "python-dotenv",
    "sqlalchemy",
    "psycopg[binary]",
    "beautifulsoup4",
    "lxml",
    "syntok",
    "pdfplumber",
    "alembic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
